services:
  postgres:
    image: postgres:16-alpine
    container_name: treo-postgres
    environment:
      POSTGRES_USER: postgres
      # Solo para desarrollo local. No es un secreto real.
      POSTGRES_PASSWORD: postgres
    ports:
      # Puerto 5433 en el host para no chocar con un PostgreSQL ya instalado en 5432.
      - '5433:5432'
    volumes:
      - treo-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  treo-pgdata:
